---
devices:
  NXOS9k1:
    alias: "Sandbox NXOS9k1"
    type: "switch"
    os: "nxos"
    platform: NXOS9k
    credentials:
      default:
        username: admin
        password: Cisco@1234!!
      enable:
        password: cisco
    connections:
      cli:
        protocol: ssh
        ip: 10.0.0.217
        port: 22
        arguments:
          connection_timeout: 360
